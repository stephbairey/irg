name: Fetch press clippings

# Daily run that pulls new "Raging Grannies" coverage from Google News
# RSS (via scripts/fetch-press.mjs, D047) and commits any new entries to
# data/press-clippings.json. The push triggers Cloudflare Pages to
# rebuild the site, which is how the new clippings end up on
# /in-the-news/.
#
# Failure-tolerant: the script catches all fetch/parse errors and exits
# 0, so this workflow only commits when there's a real diff. Quiet days
# are no-ops. The health-check step at the end is the alarm on top: it
# fails the run (and GitHub emails about it) when nothing has been
# ingested for 30 days, so a silently dead feed can't hide behind
# green runs (F2).

on:
  schedule:
    # 13:17 UTC daily (~6 AM Pacific / 9 AM Eastern). Off-the-hour to
    # avoid the at-the-top-of-hour cron rush on GitHub's runners.
    - cron: "17 13 * * *"
  workflow_dispatch: # allow ad-hoc runs from the Actions tab

permissions:
  contents: write # needed to commit the updated archive

concurrency:
  group: fetch-press
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run fetch-press.mjs
        run: node scripts/fetch-press.mjs

      - name: Commit if archive changed
        run: |
          if git diff --quiet data/press-clippings.json; then
            echo "No new clippings — archive unchanged."
            exit 0
          fi
          git config user.name "irg-press-bot"
          git config user.email "press-bot@users.noreply.github.com"
          git add data/press-clippings.json
          # Quote count of new entries from the diff for the commit body.
          NEW_COUNT=$(git diff --cached --shortstat data/press-clippings.json | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "?")
          git commit -m "chore(press): auto-fetch new clippings" -m "Lines added: $NEW_COUNT (commit by GitHub Actions)."
          git push

      # Runs after the commit so a stale-feed alert never blocks a commit
      # (when the feed is stale there is nothing to commit anyway).
      - name: Health check — alert if the feed has gone quiet
        run: node scripts/press-health-check.mjs
